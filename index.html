<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>欢迎来到我的网站！</h1>
            <p>这是我用 GitHub Pages 创建的第一个网站</p>
        </div>
    </header>

    <main>
        <section class="about">
            <div class="container">
                <h2>关于我</h2>
                <div class="avatar">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20portrait%20of%20a%20young%20developer%20smiling&image_size=square" alt="头像">
                </div>
                <p>大家好！我是一名正在学习编程的新手。这是我的第一个个人网站，用来记录我的学习历程和分享技术心得。</p>
            </div>
        </section>

        <section class="skills">
            <div class="container">
                <h2>我的技能</h2>
                <div class="skill-list">
                    <div class="skill">HTML5</div>
                    <div class="skill">CSS3</div>
                    <div class="skill">JavaScript</div>
                    <div class="skill">GitHub</div>
                </div>
            </div>
        </section>

        <section class="projects">
            <div class="container">
                <h2>我的项目</h2>
                <div class="project-card">
                    <h3>项目一：个人网站</h3>
                    <p>使用 HTML、CSS、JavaScript 创建的个人主页</p>
                </div>
                <div class="project-card">
                    <h3>项目二：学习笔记</h3>
                    <p>记录编程学习过程中的笔记和心得</p>
                </div>
            </div>
        </section>

        <section class="contact">
            <div class="container">
                <h2>联系我</h2>
                <p>邮箱：hello@example.com</p>
                <p>GitHub：<a href="https://github.com" target="_blank">github.com/myusername</a></p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 我的第一个网站 | 使用 GitHub Pages 托管</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
